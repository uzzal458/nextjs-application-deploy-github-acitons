services:
  web:
    image: ${IMAGE:-nextjs-todo:latest}
    build:
      context: .
    container_name: nextjs-todo
    restart: unless-stopped
    ports:
      - "${PORT:-3010}:3010"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
