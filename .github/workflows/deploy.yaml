name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /home/${{ secrets.SSH_USER }}/nextjs-todo
  APP_PORT: 3010

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          # Fails early if SSH_KEY is not a valid private key
          ssh-keygen -y -f ~/.ssh/ec2.pem > /dev/null
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          # Only use this key, and fail instead of prompting
          printf 'Host *\n  IdentityFile ~/.ssh/ec2.pem\n  IdentitiesOnly yes\n  BatchMode yes\n' > ~/.ssh/config
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo SSH connection OK"

      - name: Copy project files to EC2
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p $APP_DIR"
          # Excluded paths are also kept on the server (e.g. its own .env)
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$APP_DIR/

      - name: Build and restart container
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            cd $APP_DIR
            docker compose up -d --build --force-recreate --remove-orphans
            docker image prune -f
          "

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null "http://${{ secrets.SSH_HOST }}:$APP_PORT/"; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app... ($i/10)"
            sleep 3
          done
          echo "App did not respond on port $APP_PORT"
          exit 1
